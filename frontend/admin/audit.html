<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#0b3d2e">
  <meta name="description" content="Global TrustFund Admin Audit Logs">

  <title>Audit Logs | Global TrustFund Admin</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    .audit-page {
      padding: 24px;
    }

    .audit-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .audit-header h1 {
      margin: 0;
    }

    .audit-header p {
      margin: 6px 0 0;
      opacity: .7;
    }

    .audit-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .audit-toolbar {
      display: grid;
      grid-template-columns: 1.5fr repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .audit-toolbar input,
    .audit-toolbar select {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 8px;
      background: var(--card-bg, #fff);
      color: inherit;
      box-sizing: border-box;
    }

    .audit-card {
      background: var(--card-bg, #fff);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,.08);
      box-shadow: 0 4px 18px rgba(0,0,0,.05);
    }

    .audit-table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    .audit-table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    .audit-table th,
    .audit-table td {
      padding: 14px 16px;
      text-align: left;
      border-bottom: 1px solid rgba(0,0,0,.07);
      vertical-align: middle;
    }

    .audit-table th {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      opacity: .7;
      background: rgba(11,61,46,.035);
    }

    .audit-table tbody tr:hover {
      background: rgba(11,61,46,.025);
    }

    .audit-user {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .audit-user strong {
      font-size: 14px;
    }

    .audit-user small {
      opacity: .65;
    }

    .audit-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .badge-success {
      color: #146c43;
      background: #d1e7dd;
    }

    .badge-warning {
      color: #856404;
      background: #fff3cd;
    }

    .badge-danger {
      color: #842029;
      background: #f8d7da;
    }

    .badge-info {
      color: #055160;
      background: #cff4fc;
    }

    .badge-neutral {
      color: #495057;
      background: #e9ecef;
    }

    .audit-event {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .audit-event strong {
      font-size: 14px;
    }

    .audit-event span {
      font-size: 12px;
      opacity: .65;
    }

    .audit-pagination {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      padding: 16px;
      flex-wrap: wrap;
    }

    .audit-pagination-info {
      font-size: 13px;
      opacity: .7;
    }

    .pagination-buttons {
      display: flex;
      gap: 8px;
    }

    .pagination-buttons button {
      min-width: 38px;
      height: 38px;
      border: 1px solid rgba(0,0,0,.12);
      border-radius: 7px;
      background: transparent;
      cursor: pointer;
    }

    .pagination-buttons button.active {
      background: #0b3d2e;
      color: #fff;
      border-color: #0b3d2e;
    }

    .pagination-buttons button:disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .empty-state {
      display: none;
      padding: 50px 20px;
      text-align: center;
      opacity: .7;
    }

    .audit-loading {
      padding: 45px 20px;
      text-align: center;
      opacity: .7;
    }

    .audit-detail-modal {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0,0,0,.55);
    }

    .audit-detail-modal.open {
      display: flex;
    }

    .audit-detail-box {
      width: min(720px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      background: var(--card-bg, #fff);
      border-radius: 14px;
      padding: 24px;
      box-sizing: border-box;
    }

    .audit-detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 20px;
    }

    .audit-detail-header h2 {
      margin: 0;
    }

    .close-modal {
      border: 0;
      background: transparent;
      font-size: 25px;
      cursor: pointer;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .detail-item {
      padding: 13px;
      border-radius: 8px;
      background: rgba(11,61,46,.04);
    }

    .detail-item.full {
      grid-column: 1 / -1;
    }

    .detail-item label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .05em;
      opacity: .6;
      margin-bottom: 5px;
    }

    .detail-item strong,
    .detail-item code {
      word-break: break-word;
    }

    @media (max-width: 1000px) {
      .audit-toolbar {
        grid-template-columns: repeat(2, 1fr);
      }

      .audit-toolbar input {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 650px) {
      .audit-page {
        padding: 15px;
      }

      .audit-toolbar {
        grid-template-columns: 1fr;
      }

      .audit-toolbar input {
        grid-column: auto;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }

      .detail-item.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <!-- Global navigation/header is injected by the admin application -->
  <div id="app-header"></div>

  <main class="admin-main audit-page">

    <section class="audit-header">
      <div>
        <h1>Audit Logs</h1>
        <p>Monitor administrative activity, security events and system changes.</p>
      </div>

      <div class="audit-actions">
        <button type="button" class="btn btn-secondary" id="refreshAuditBtn">
          Refresh
        </button>

        <button type="button" class="btn btn-primary" id="exportAuditBtn">
          Export Logs
        </button>
      </div>
    </section>

    <!-- Filters -->
    <section class="audit-toolbar" aria-label="Audit log filters">

      <input
        type="search"
        id="auditSearch"
        placeholder="Search user, event, IP address..."
        autocomplete="off"
      >

      <select id="eventFilter">
        <option value="">All Events</option>
        <option value="login">Login</option>
        <option value="logout">Logout</option>
        <option value="account">Account</option>
        <option value="transaction">Transaction</option>
        <option value="customer">Customer</option>
        <option value="security">Security</option>
        <option value="settings">Settings</option>
        <option value="compliance">Compliance</option>
      </select>

      <select id="statusFilter">
        <option value="">All Statuses</option>
        <option value="success">Success</option>
        <option value="warning">Warning</option>
        <option value="failed">Failed</option>
      </select>

      <select id="roleFilter">
        <option value="">All Roles</option>
        <option value="admin">Admin</option>
        <option value="manager">Manager</option>
        <option value="cashier">Cashier</option>
        <option value="support">Support</option>
        <option value="customer">Customer</option>
      </select>

      <input type="date" id="dateFilter" aria-label="Filter by date">

    </section>

    <!-- Audit table -->
    <section class="audit-card">

      <div class="audit-table-wrapper">

        <table class="audit-table">
          <thead>
            <tr>
              <th>Date & Time</th>
              <th>User</th>
              <th>Event</th>
              <th>Action</th>
              <th>Status</th>
              <th>IP Address</th>
              <th>Details</th>
            </tr>
          </thead>

          <tbody id="auditTableBody">

            <tr id="auditLoadingRow">
              <td colspan="7">
                <div class="audit-loading">
                  Loading audit logs...
                </div>
              </td>
            </tr>

          </tbody>
        </table>

        <div class="empty-state" id="auditEmptyState">
          No audit records match the selected filters.
        </div>

      </div>

      <div class="audit-pagination">

        <div class="audit-pagination-info" id="auditPaginationInfo">
          Showing 0 records
        </div>

        <div class="pagination-buttons">
          <button type="button" id="previousPageBtn" disabled>
            ‹
          </button>

          <button type="button" class="active" id="currentPageBtn">
            1
          </button>

          <button type="button" id="nextPageBtn" disabled>
            ›
          </button>
        </div>

      </div>

    </section>

  </main>

  <!-- Audit detail modal -->
  <div
    class="audit-detail-modal"
    id="auditDetailModal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="auditDetailTitle"
  >

    <div class="audit-detail-box">

      <div class="audit-detail-header">
        <h2 id="auditDetailTitle">Audit Event</h2>

        <button
          type="button"
          class="close-modal"
          id="closeAuditModal"
          aria-label="Close audit details"
        >
          ×
        </button>
      </div>

      <div class="detail-grid" id="auditDetailContent">
        <!-- Details inserted by JavaScript -->
      </div>

    </div>

  </div>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>

  <script>
    (() => {
      "use strict";

      const state = {
        logs: [],
        filteredLogs: [],
        page: 1,
        pageSize: 10
      };

      const elements = {
        body: document.getElementById("auditTableBody"),
        empty: document.getElementById("auditEmptyState"),
        search: document.getElementById("auditSearch"),
        event: document.getElementById("eventFilter"),
        status: document.getElementById("statusFilter"),
        role: document.getElementById("roleFilter"),
        date: document.getElementById("dateFilter"),
        previous: document.getElementById("previousPageBtn"),
        next: document.getElementById("nextPageBtn"),
        current: document.getElementById("currentPageBtn"),
        paginationInfo: document.getElementById("auditPaginationInfo"),
        refresh: document.getElementById("refreshAuditBtn"),
        export: document.getElementById("exportAuditBtn"),
        modal: document.getElementById("auditDetailModal"),
        modalClose: document.getElementById("closeAuditModal"),
        modalContent: document.getElementById("auditDetailContent")
      };

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function formatDate(value) {
        if (!value) return "—";

        const date = new Date(value);

        if (Number.isNaN(date.getTime())) {
          return escapeHtml(value);
        }

        return date.toLocaleString([], {
          year: "numeric",
          month: "short",
          day: "2-digit",
          hour: "2-digit",
          minute: "2-digit"
        });
      }

      function statusClass(status) {
        const value = String(status || "").toLowerCase();

        if (value === "success") return "badge-success";
        if (value === "warning") return "badge-warning";
        if (
          value === "failed" ||
          value === "failure" ||
          value === "error"
        ) {
          return "badge-danger";
        }

        if (value === "info") return "badge-info";

        return "badge-neutral";
      }

      function normalizeLog(log) {
        return {
          id: log.id || log.audit_id || crypto.randomUUID(),
          created_at:
            log.created_at ||
            log.timestamp ||
            log.createdAt ||
            new Date().toISOString(),

          user_name:
            log.user_name ||
            log.user ||
            log.actor_name ||
            "System",

          user_email:
            log.user_email ||
            log.email ||
            "",

          role:
            log.role ||
            log.user_role ||
            "—",

          event:
            log.event ||
            log.event_type ||
            log.category ||
            "system",

          action:
            log.action ||
            log.description ||
            "System activity",

          status:
            log.status ||
            "success",

          ip_address:
            log.ip_address ||
            log.ip ||
            "—",

          user_agent:
            log.user_agent ||
            "—",

          details:
            log.details ||
            log.metadata ||
            {}
        };
      }

      async function loadAuditLogs() {
        renderLoading();

        try {
          /*
           * The preferred production endpoint is:
           *
           * GET /api/admin/audit
           *
           * This page deliberately supports the existing api.js
           * wrapper when available.
           */

          let response;

          if (window.API && typeof window.API.get === "function") {
            response = await window.API.get("/admin/audit");
          } else {
            response = await fetch("../api/admin/audit", {
              credentials: "include"
            });

            if (!response.ok) {
              throw new Error("Unable to load audit logs.");
            }

            response = await response.json();
          }

          const records =
            Array.isArray(response)
              ? response
              : response.data ||
                response.logs ||
                response.audit_logs ||
                [];

          state.logs = records.map(normalizeLog);

        } catch (error) {

          /*
           * Keep the page usable during frontend development when
           * the backend audit endpoint has not yet been connected.
           */
          console.warn("Audit API unavailable:", error);

          state.logs = [];

          showEmpty(
            "Audit logs could not be loaded. Verify the admin API connection."
          );

        }

        state.page = 1;
        applyFilters();
      }

      function renderLoading() {
        elements.empty.style.display = "none";

        elements.body.innerHTML = `
          <tr>
            <td colspan="7">
              <div class="audit-loading">
                Loading audit logs...
              </div>
            </td>
          </tr>
        `;
      }

      function showEmpty(message) {
        elements.empty.textContent =
          message ||
          "No audit records match the selected filters.";

        elements.empty.style.display = "block";
      }

      function applyFilters() {

        const query =
          elements.search.value
            .trim()
            .toLowerCase();

        const event =
          elements.event.value
            .trim()
            .toLowerCase();

        const status =
          elements.status.value
            .trim()
            .toLowerCase();

        const role =
          elements.role.value
            .trim()
            .toLowerCase();

        const date =
          elements.date.value;

        state.filteredLogs =
          state.logs.filter(log => {

            const searchable = [
              log.user_name,
              log.user_email,
              log.event,
              log.action,
              log.ip_address,
              log.role
            ]
              .join(" ")
              .toLowerCase();

            if (
              query &&
              !searchable.includes(query)
            ) {
              return false;
            }

            if (
              event &&
              String(log.event).toLowerCase() !== event
            ) {
              return false;
            }

            if (
              status &&
              String(log.status).toLowerCase() !== status
            ) {
              return false;
            }

            if (
              role &&
              String(log.role).toLowerCase() !== role
            ) {
              return false;
            }

            if (date) {
              const logDate =
                new Date(log.created_at)
                  .toISOString()
                  .slice(0, 10);

              if (logDate !== date) {
                return false;
              }
            }

            return true;
          });

        const totalPages =
          Math.max(
            1,
            Math.ceil(
              state.filteredLogs.length /
              state.pageSize
            )
          );

        if (state.page > totalPages) {
          state.page = totalPages;
        }

        renderTable();
      }

      function renderTable() {

        const start =
          (state.page - 1) *
          state.pageSize;

        const end =
          start +
          state.pageSize;

        const rows =
          state.filteredLogs.slice(start, end);

        elements.body.innerHTML = "";

        if (!rows.length) {
          showEmpty();
        } else {
          elements.empty.style.display = "none";

          rows.forEach(log => {

            const row =
              document.createElement("tr");

            row.innerHTML = `
              <td>
                ${formatDate(log.created_at)}
              </td>

              <td>
                <div class="audit-user">
                  <strong>
                    ${escapeHtml(log.user_name)}
                  </strong>

                  <small>
                    ${escapeHtml(log.user_email)}
                  </small>
                </div>
              </td>

              <td>
                <span class="audit-badge badge-neutral">
                  ${escapeHtml(log.event)}
                </span>
              </td>

              <td>
                <div class="audit-event">
                  <strong>
                    ${escapeHtml(log.action)}
                  </strong>

                  <span>
                    Role: ${escapeHtml(log.role)}
                  </span>
                </div>
              </td>

              <td>
                <span class="audit-badge ${statusClass(log.status)}">
                  ${escapeHtml(log.status)}
                </span>
              </td>

              <td>
                ${escapeHtml(log.ip_address)}
              </td>

              <td>
                <button
                  type="button"
                  class="btn btn-sm btn-secondary"
                  data-audit-id="${escapeHtml(log.id)}"
                >
                  View
                </button>
              </td>
            `;

            elements.body.appendChild(row);
          });
        }

        updatePagination();
      }

      function updatePagination() {

        const total =
          state.filteredLogs.length;

        const totalPages =
          Math.max(
            1,
            Math.ceil(
              total /
              state.pageSize
            )
          );

        const start =
          total === 0
            ? 0
            : ((state.page - 1) *
                state.pageSize) +
              1;

        const end =
          Math.min(
            state.page *
              state.pageSize,
            total
          );

        elements.paginationInfo.textContent =
          total === 0
            ? "Showing 0 records"
            : `Showing ${start}-${end} of ${total} records`;

        elements.current.textContent =
          state.page;

        elements.previous.disabled =
          state.page <= 1;

        elements.next.disabled =
          state.page >= totalPages;
      }

      function openDetails(id) {

        const log =
          state.logs.find(
            item => String(item.id) === String(id)
          );

        if (!log) return;

        let details = log.details;

        if (
          typeof details === "object"
        ) {
          details = JSON.stringify(
            details,
            null,
            2
          );
        }

        elements.modalContent.innerHTML = `

          <div class="detail-item">
            <label>Event ID</label>
            <strong>
              ${escapeHtml(log.id)}
            </strong>
          </div>

          <div class="detail-item">
            <label>Date & Time</label>
            <strong>
              ${formatDate(log.created_at)}
            </strong>
          </div>

          <div class="detail-item">
            <label>User</label>
            <strong>
              ${escapeHtml(log.user_name)}
            </strong>
          </div>

          <div class="detail-item">
            <label>Email</label>
            <strong>
              ${escapeHtml(log.user_email || "—")}
            </strong>
          </div>

          <div class="detail-item">
            <label>Role</label>
            <strong>
              ${escapeHtml(log.role)}
            </strong>
          </div>

          <div class="detail-item">
            <label>Status</label>
            <strong>
              ${escapeHtml(log.status)}
            </strong>
          </div>

          <div class="detail-item">
            <label>IP Address</label>
            <strong>
              ${escapeHtml(log.ip_address)}
            </strong>
          </div>

          <div class="detail-item">
            <label>Event</label>
            <strong>
              ${escapeHtml(log.event)}
            </strong>
          </div>

          <div class="detail-item full">
            <label>Action</label>
            <strong>
              ${escapeHtml(log.action)}
            </strong>
          </div>

          <div class="detail-item full">
            <label>User Agent</label>
            <code>
              ${escapeHtml(log.user_agent)}
            </code>
          </div>

          <div class="detail-item full">
            <label>Additional Details</label>
            <pre>${escapeHtml(details || "No additional details.")}</pre>
          </div>
        `;

        elements.modal.classList.add("open");
      }

      function closeDetails() {
        elements.modal.classList.remove("open");
      }

      function exportLogs() {

        if (!state.filteredLogs.length) {
          alert("There are no audit records to export.");
          return;
        }

        const headers = [
          "ID",
          "Date",
          "User",
          "Email",
          "Role",
          "Event",
          "Action",
          "Status",
          "IP Address"
        ];

        const rows =
          state.filteredLogs.map(log => [
            log.id,
            log.created_at,
            log.user_name,
            log.user_email,
            log.role,
            log.event,
            log.action,
            log.status,
            log.ip_address
          ]);

        const csv = [
          headers,
          ...rows
        ]
          .map(row =>
            row
              .map(value =>
                `"${String(value ?? "")
                  .replace(/"/g, '""')}"`
              )
              .join(",")
          )
          .join("\n");

        const blob =
          new Blob(
            [csv],
            { type: "text/csv;charset=utf-8;" }
          );

        const url =
          URL.createObjectURL(blob);

        const link =
          document.createElement("a");

        link.href = url;
        link.download =
          `global-trustfund-audit-${new Date()
            .toISOString()
            .slice(0, 10)}.csv`;

        document.body.appendChild(link);
        link.click();
        link.remove();

        URL.revokeObjectURL(url);
      }

      // Filters
      [
        elements.search,
        elements.event,
        elements.status,
        elements.role,
        elements.date
      ].forEach(element => {
        element.addEventListener(
          "input",
          () => {
            state.page = 1;
            applyFilters();
          }
        );

        element.addEventListener(
          "change",
          () => {
            state.page = 1;
            applyFilters();
          }
        );
      });

      // Pagination
      elements.previous.addEventListener(
        "click",
        () => {
          if (state.page > 1) {
            state.page--;
            renderTable();
          }
        }
      );

      elements.next.addEventListener(
        "click",
        () => {
          const totalPages =
            Math.ceil(
              state.filteredLogs.length /
              state.pageSize
            );

          if (state.page < totalPages) {
            state.page++;
            renderTable();
          }
        }
      );

      // Table actions
      elements.body.addEventListener(
        "click",
        event => {

          const button =
            event.target.closest(
              "[data-audit-id]"
            );

          if (!button) return;

          openDetails(
            button.dataset.auditId
          );
        }
      );

      elements.refresh.addEventListener(
        "click",
        loadAuditLogs
      );

      elements.export.addEventListener(
        "click",
        exportLogs
      );

      elements.modalClose.addEventListener(
        "click",
        closeDetails
      );

      elements.modal.addEventListener(
        "click",
        event => {
          if (
            event.target ===
            elements.modal
          ) {
            closeDetails();
          }
        }
      );

      document.addEventListener(
        "keydown",
        event => {
          if (event.key === "Escape") {
            closeDetails();
          }
        }
      );

      // Initial load
      loadAuditLogs();

    })();
  </script>

</body>
</html>
