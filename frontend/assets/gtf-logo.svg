<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="gtfLogoTitle gtfLogoDesc"
>

  <title id="gtfLogoTitle">
    Global TrustFund
  </title>

  <desc id="gtfLogoDesc">
    Global TrustFund GTF banking logo in dark green,
    white and gold.
  </desc>


  <!-- =====================================================
       DEFINITIONS
  ====================================================== -->

  <defs>

    <!-- Main green gradient -->

    <linearGradient
      id="gtfGreen"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >

      <stop
        offset="0%"
        stop-color="#0b3d2e"
      />

      <stop
        offset="100%"
        stop-color="#06291f"
      />

    </linearGradient>


    <!-- Gold gradient -->

    <linearGradient
      id="gtfGold"
      x1="0"
      y1="0"
      x2="1"
      y2="1"
    >

      <stop
        offset="0%"
        stop-color="#f5d77a"
      />

      <stop
        offset="45%"
        stop-color="#d4af37"
      />

      <stop
        offset="100%"
        stop-color="#a77c12"
      />

    </linearGradient>


    <!-- Subtle shadow -->

    <filter
      id="gtfShadow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >

      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity="0.22"
      />

    </filter>

  </defs>


  <!-- =====================================================
       OUTER EMBLEM
  ====================================================== -->

  <circle
    cx="256"
    cy="256"
    r="226"
    fill="url(#gtfGreen)"
    filter="url(#gtfShadow)"
  />


  <!-- Gold outer border -->

  <circle
    cx="256"
    cy="256"
    r="213"
    fill="none"
    stroke="url(#gtfGold)"
    stroke-width="10"
  />


  <!-- White inner border -->

  <circle
    cx="256"
    cy="256"
    r="194"
    fill="none"
    stroke="#ffffff"
    stroke-opacity="0.92"
    stroke-width="3"
  />


  <!-- =====================================================
       TRUST SHIELD
  ====================================================== -->

  <path
    d="
      M256 78
      L378 126
      V242
      C378 323 327 389 256 424
      C185 389 134 323 134 242
      V126
      Z
    "
    fill="#ffffff"
    fill-opacity="0.98"
  />


  <!-- Shield gold border -->

  <path
    d="
      M256 91
      L365 134
      V241
      C365 314 319 372 256 407
      C193 372 147 314 147 241
      V134
      Z
    "
    fill="none"
    stroke="url(#gtfGold)"
    stroke-width="7"
  />


  <!-- =====================================================
       GLOBE
  ====================================================== -->

  <circle
    cx="256"
    cy="246"
    r="69"
    fill="url(#gtfGreen)"
  />


  <!-- Globe horizontal lines -->

  <path
    d="M190 246 H322"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.9"
  />

  <path
    d="M201 219
       C233 237 279 237 311 219"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    opacity="0.8"
  />

  <path
    d="M201 273
       C233 255 279 255 311 273"
    fill="none"
    stroke="#ffffff"
    stroke-width="3"
    opacity="0.8"
  />


  <!-- Globe longitude -->

  <ellipse
    cx="256"
    cy="246"
    rx="28"
    ry="69"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    opacity="0.9"
  />

  <ellipse
    cx="256"
    cy="246"
    rx="55"
    ry="69"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    opacity="0.6"
  />


  <!-- =====================================================
       GTF MONOGRAM
  ====================================================== -->

  <text
    x="256"
    y="181"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="52"
    font-weight="800"
    letter-spacing="3"
    fill="url(#gtfGold)"
  >
    GTF
  </text>


  <!-- =====================================================
       TRUST ARC
  ====================================================== -->

  <path
    d="
      M178 337
      Q256 377 334 337
    "
    fill="none"
    stroke="url(#gtfGold)"
    stroke-width="7"
    stroke-linecap="round"
  />


  <!-- =====================================================
       CENTRAL STAR
  ====================================================== -->

  <path
    d="
      M256 292
      L263 308
      L281 310
      L267 322
      L271 340
      L256 331
      L241 340
      L245 322
      L231 310
      L249 308
      Z
    "
    fill="url(#gtfGold)"
  />


  <!-- =====================================================
       BRAND NAME
  ====================================================== -->

  <text
    x="256"
    y="465"
    text-anchor="middle"
    font-family="Inter, Arial, sans-serif"
    font-size="22"
    font-weight="700"
    letter-spacing="3"
    fill="#ffffff"
  >
    GLOBAL TRUSTFUND
  </text>

</svg>