<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Global TrustFund Logo</title>
  <desc id="desc">
    Green, white and gold Global TrustFund GTF emblem.
  </desc>

  <defs>
    <linearGradient id="greenGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#145a43"/>
      <stop offset="55%" stop-color="#0b3d2e"/>
      <stop offset="100%" stop-color="#061f18"/>
    </linearGradient>

    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0d66d"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#a88418"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="10"
        flood-color="#000000"
        flood-opacity=".28"
      />
    </filter>
  </defs>

  <!-- Outer emblem -->
  <circle
    cx="256"
    cy="256"
    r="238"
    fill="url(#greenGradient)"
    stroke="url(#goldGradient)"
    stroke-width="10"
    filter="url(#shadow)"
  />

  <!-- Inner ring -->
  <circle
    cx="256"
    cy="256"
    r="203"
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".16"
    stroke-width="3"
  />

  <!-- Gold accent ring -->
  <circle
    cx="256"
    cy="256"
    r="185"
    fill="none"
    stroke="url(#goldGradient)"
    stroke-opacity=".55"
    stroke-width="4"
  />

  <!-- Stylized G -->
  <path
    d="
      M286 151
      C264 134 236 126 207 129
      C151 135 111 181 111 241
      C111 304 158 350 218 350
      C249 350 277 339 297 319
      L297 252
      L217 252
      L217 286
      L258 286
      C248 297 235 303 218 303
      C181 303 158 277 158 241
      C158 204 181 176 215 174
      C236 172 253 179 267 191
      Z
    "
    fill="#ffffff"
  />

  <!-- T vertical -->
  <path
    d="
      M279 178
      L401 178
      L401 219
      L365 219
      L365 345
      L315 345
      L315 219
      L279 219
      Z
    "
    fill="url(#goldGradient)"
  />

  <!-- Trust / financial bar -->
  <path
    d="
      M132 374
      L380 374
      L367 390
      L145 390
      Z
    "
    fill="#ffffff"
    fill-opacity=".9"
  />

  <!-- Small gold foundation line -->
  <rect
    x="169"
    y="401"
    width="174"
    height="7"
    rx="3.5"
    fill="url(#goldGradient)"
  />

  <!-- Decorative dots -->
  <circle
    cx="90"
    cy="256"
    r="6"
    fill="#d4af37"
  />

  <circle
    cx="422"
    cy="256"
    r="6"
    fill="#d4af37"
  />

  <!-- Subtle center highlight -->
  <circle
    cx="256"
    cy="256"
    r="150"
    fill="none"
    stroke="#ffffff"
    stroke-opacity=".035"
    stroke-width="22"
  />
</svg>
