<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#0b3d2e"
  >

  <meta
    name="description"
    content="Global TrustFund Cashier Portal Login"
  >

  <title>Cashier Login | Global TrustFund</title>

  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/auth.css">
  <link rel="stylesheet" href="../css/responsive.css">

  <style>
    body.auth-page {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #f5f8f6 0%,
          #eef4f1 100%
        );
    }

    .auth-wrapper {
      width: 100%;
      max-width: 460px;
      padding: 24px;
      box-sizing: border-box;
    }

    .auth-card {
      overflow: hidden;
      background: #fff;
      border: 1px solid rgba(0,0,0,.08);
      border-radius: 16px;
      box-shadow:
        0 18px 50px rgba(0,0,0,.09);
    }

    .auth-header {
      padding: 30px 30px 22px;
      text-align: center;
      border-bottom: 1px solid rgba(0,0,0,.07);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
      text-decoration: none;
      color: #0b3d2e;
    }

    .brand-mark {
      display: inline-flex;
      width: 42px;
      height: 42px;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      background: #0b3d2e;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -.04em;
    }

    .brand-text {
      text-align: left;
      line-height: 1.1;
    }

    .brand-name {
      display: block;
      font-size: 17px;
      font-weight: 800;
    }

    .brand-subtitle {
      display: block;
      margin-top: 3px;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      opacity: .55;
    }

    .auth-header h1 {
      margin: 0;
      color: #15251f;
      font-size: 23px;
    }

    .auth-header p {
      margin: 8px 0 0;
      color: #66736e;
      font-size: 11px;
      line-height: 1.5;
    }

    .role-badge {
      display: inline-flex;
      margin-top: 14px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(11,61,46,.08);
      color: #0b3d2e;
      font-size: 8px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .auth-body {
      padding: 28px 30px;
    }

    .alert {
      display: none;
      margin-bottom: 18px;
      padding: 11px 13px;
      border-radius: 8px;
      font-size: 11px;
      line-height: 1.5;
    }

    .alert.show {
      display: block;
    }

    .alert.error {
      background: #f8d7da;
      color: #842029;
    }

    .alert.info {
      background: #cff4fc;
      color: #055160;
    }

    .alert.success {
      background: #d1e7dd;
      color: #146c43;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      color: #34433d;
      font-size: 10px;
      font-weight: 750;
      text-transform: uppercase;
      letter-spacing: .04em;
    }

    .input-wrapper {
      position: relative;
    }

    .form-control {
      width: 100%;
      min-height: 44px;
      box-sizing: border-box;
      padding: 11px 12px;
      border: 1px solid rgba(0,0,0,.16);
      border-radius: 8px;
      background: #fff;
      color: #17231f;
      font: inherit;
      font-size: 12px;
      outline: none;
      transition:
        border-color .15s ease,
        box-shadow .15s ease;
    }

    .form-control:focus {
      border-color: #0b3d2e;
      box-shadow:
        0 0 0 3px rgba(11,61,46,.09);
    }

    .password-input {
      padding-right: 72px;
    }

    .toggle-password {
      position: absolute;
      top: 50%;
      right: 8px;
      transform: translateY(-50%);
      min-height: 32px;
      padding: 0 8px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #0b3d2e;
      cursor: pointer;
      font-size: 9px;
      font-weight: 750;
    }

    .toggle-password:hover {
      background: rgba(11,61,46,.06);
    }

    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .remember-option {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #58645f;
      font-size: 10px;
      cursor: pointer;
    }

    .remember-option input {
      width: 14px;
      height: 14px;
      margin: 0;
      accent-color: #0b3d2e;
    }

    .forgot-link {
      color: #0b3d2e;
      font-size: 10px;
      font-weight: 700;
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .login-button {
      width: 100%;
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      background: #0b3d2e;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .02em;
    }

    .login-button:hover {
      filter: brightness(.95);
    }

    .login-button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .auth-footer {
      padding: 20px 30px;
      border-top: 1px solid rgba(0,0,0,.07);
      text-align: center;
    }

    .security-note {
      margin: 0;
      color: #66736e;
      font-size: 9px;
      line-height: 1.6;
    }

    .back-link {
      display: inline-block;
      margin-top: 12px;
      color: #0b3d2e;
      font-size: 10px;
      font-weight: 700;
      text-decoration: none;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    .loading-indicator {
      display: none;
      margin-left: 7px;
    }

    .loading-indicator.show {
      display: inline;
    }

    @media (max-width: 520px) {
      .auth-wrapper {
        padding: 15px;
      }

      .auth-header,
      .auth-body {
        padding-left: 22px;
        padding-right: 22px;
      }

      .auth-footer {
        padding-left: 22px;
        padding-right: 22px;
      }

      .form-options {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body class="auth-page">

  <main class="auth-wrapper">

    <section class="auth-card">

      <header class="auth-header">

        <a
          href="../index.html"
          class="brand"
          aria-label="Global TrustFund home"
        >

          <span class="brand-mark">
            GT
          </span>

          <span class="brand-text">

            <span class="brand-name">
              Global TrustFund
            </span>

            <span class="brand-subtitle">
              Banking
            </span>

          </span>

        </a>

        <h1>
          Cashier Login
        </h1>

        <p>
          Sign in to access authorized cashier operations.
        </p>

        <span class="role-badge">
          Cashier Portal
        </span>

      </header>

      <div class="auth-body">

        <div
          id="alert"
          class="alert"
          role="alert"
          aria-live="assertive"
        ></div>

        <form
          id="loginForm"
          novalidate
        >

          <div class="form-group">

            <label for="identifier">
              Employee ID or Email
            </label>

            <div class="input-wrapper">

              <input
                id="identifier"
                name="identifier"
                class="form-control"
                type="text"
                autocomplete="username"
                placeholder="Enter your employee ID or email"
                required
              >

            </div>

          </div>

          <div class="form-group">

            <label for="password">
              Password
            </label>

            <div class="input-wrapper">

              <input
                id="password"
                name="password"
                class="form-control password-input"
                type="password"
                autocomplete="current-password"
                placeholder="Enter your password"
                required
              >

              <button
                type="button"
                id="togglePassword"
                class="toggle-password"
                aria-label="Show password"
              >
                Show
              </button>

            </div>

          </div>

          <div class="form-options">

            <label class="remember-option">

              <input
                id="remember"
                name="remember"
                type="checkbox"
              >

              <span>
                Keep me signed in
              </span>

            </label>

            <a
              href="../forgot-password.html"
              class="forgot-link"
            >
              Forgot password?
            </a>

          </div>

          <button
            id="loginButton"
            class="login-button"
            type="submit"
          >

            <span>
              Sign In
            </span>

            <span
              id="loadingIndicator"
              class="loading-indicator"
              aria-hidden="true"
            >
              ...
            </span>

          </button>

        </form>

      </div>

      <footer class="auth-footer">

        <p class="security-note">
          Access is restricted to authorized Global TrustFund
          personnel. All authentication and account activity
          may be logged for security and audit purposes.
        </p>

        <a
          href="../index.html"
          class="back-link"
        >
          Return to main site
        </a>

      </footer>

    </section>

  </main>

  <script src="../js/api.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/app.js"></script>

  <script>
    (() => {

      "use strict";

      const form =
        document.getElementById(
          "loginForm"
        );

      const identifier =
        document.getElementById(
          "identifier"
        );

      const password =
        document.getElementById(
          "password"
        );

      const remember =
        document.getElementById(
          "remember"
        );

      const loginButton =
        document.getElementById(
          "loginButton"
        );

      const loadingIndicator =
        document.getElementById(
          "loadingIndicator"
        );

      const togglePassword =
        document.getElementById(
          "togglePassword"
        );

      const alertBox =
        document.getElementById(
          "alert"
        );

      function showAlert(
        message,
        type = "error"
      ) {

        alertBox.textContent =
          message;

        alertBox.className =
          `alert show ${type}`;

      }

      function hideAlert() {

        alertBox.textContent =
          "";

        alertBox.className =
          "alert";

      }

      function setLoading(
        loading
      ) {

        loginButton.disabled =
          loading;

        loadingIndicator.classList.toggle(
          "show",
          loading
        );

        loginButton
          .querySelector("span")
          .textContent =
            loading
              ? "Signing In"
              : "Sign In";

      }

      function getApiError(
        error,
        fallback
      ) {

        if (!error) {
          return fallback;
        }

        return (
          error.message ||
          error.error_description ||
          error.error ||
          fallback
        );

      }

      async function loginWithAuth() {

        /*
         * Prefer the project's centralized Auth module.
         * The fallback keeps this page compatible with the
         * existing /api/auth/login backend.
         */

        if (
          window.Auth &&
          typeof window.Auth.login ===
            "function"
        ) {

          return window.Auth.login({
            identifier:
              identifier.value.trim(),

            email:
              identifier.value.trim(),

            password:
              password.value,

            remember:
              remember.checked,

            role:
              "cashier"
          });

        }

        const body = {
          identifier:
            identifier.value.trim(),

          email:
            identifier.value.trim(),

          password:
            password.value,

          remember:
            remember.checked,

          role:
            "cashier"
        };

        if (
          window.API &&
          typeof window.API.post ===
            "function"
        ) {

          return window.API.post(
            "/auth/login",
            body
          );

        }

        const response =
          await fetch(
            "../api/auth/login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              credentials:
                "include",

              body:
                JSON.stringify(body)
            }
          );

        const data =
          await response.json()
            .catch(
              () => ({})
            );

        if (!response.ok) {

          const error =
            new Error(
              data.message ||
              data.error ||
              `Login failed (${response.status})`
            );

          error.status =
            response.status;

          throw error;

        }

        return data;

      }

      function extractUser(
        response
      ) {

        return (
          response?.user ||
          response?.data?.user ||
          response?.data?.profile ||
          response?.profile ||
          null
        );

      }

      function extractRole(
        response,
        user
      ) {

        const roles =
          response?.roles ||
          response?.data?.roles ||
          user?.roles ||
          [];

        if (
          Array.isArray(roles)
        ) {

          return roles
            .map(
              role =>
                typeof role === "string"
                  ? role
                  : (
                      role.name ||
                      role.role ||
                      role.slug ||
                      ""
                    )
            )
            .map(
              role =>
                String(role)
                  .toLowerCase()
                  .replace(/[\s_-]+/g, "")
            );

        }

        const role =
          response?.role ||
          response?.data?.role ||
          user?.role ||
          "";

        return [
          String(role)
            .toLowerCase()
            .replace(/[\s_-]+/g, "")
        ];

      }

      function hasCashierRole(
        response
      ) {

        const user =
          extractUser(
            response
          );

        const roles =
          extractRole(
            response,
            user
          );

        /*
         * Do not rely on this client-side check for security.
         * The backend must enforce role authorization.
         */

        return roles.includes(
          "cashier"
        );

      }

      async function handleSubmit(
        event
      ) {

        event.preventDefault();

        hideAlert();

        const userIdentifier =
          identifier.value.trim();

        const userPassword =
          password.value;

        if (!userIdentifier) {

          showAlert(
            "Enter your employee ID or email."
          );

          identifier.focus();

          return;

        }

        if (!userPassword) {

          showAlert(
            "Enter your password."
          );

          password.focus();

          return;

        }

        setLoading(true);

        try {

          const response =
            await loginWithAuth();

          /*
           * The server is responsible for validating the
           * cashier role. If a role is returned to the
           * frontend, verify it before entering the portal.
           */

          if (
            response &&
            (
              response.role ||
              response.roles ||
              response.user?.role ||
              response.data?.role ||
              response.data?.roles
            ) &&
            !hasCashierRole(
              response
            )
          ) {

            showAlert(
              "This account is not authorized for the cashier portal.",
              "error"
            );

            return;

          }

          showAlert(
            "Authentication successful. Opening cashier portal...",
            "success"
          );

          window.setTimeout(
            () => {

              window.location.href =
                "./index.html";

            },
            300
          );

        } catch (error) {

          console.error(
            "Cashier login error:",
            error
          );

          const message =
            getApiError(
              error,
              "Unable to sign in. Please verify your credentials and try again."
            );

          showAlert(
            message,
            "error"
          );

        } finally {

          setLoading(false);

        }

      }

      togglePassword.addEventListener(
        "click",
        () => {

          const isPassword =
            password.type ===
            "password";

          password.type =
            isPassword
              ? "text"
              : "password";

          togglePassword.textContent =
            isPassword
              ? "Hide"
              : "Show";

          togglePassword.setAttribute(
            "aria-label",
            isPassword
              ? "Hide password"
              : "Show password"
          );

        }
      );

      form.addEventListener(
        "submit",
        handleSubmit
      );

      identifier.addEventListener(
        "input",
        hideAlert
      );

      password.addEventListener(
        "input",
        hideAlert
      );

      identifier.focus();

    })();
  </script>

</body>
</html>
