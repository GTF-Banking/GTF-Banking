<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Global TrustFund authorized cashier login."
>

<meta name="theme-color" content="#0b3d2e">

<title>Cashier Login | Global TrustFund</title>

<link rel="stylesheet" href="../css/styles.css">

<style>
:root {
    --g:#0b3d2e;
    --gd:#092f24;
    --gl:#176b48;
    --gold:#c9962b;
    --bg:#f4f8f6;
    --border:#dfe8e3;
    --text:#18372c;
    --muted:#7c8983;
    --danger:#8b4444;
    --danger-bg:#f9eded;
}

* {
    box-sizing:border-box;
}

html,
body {
    margin:0;
    min-height:100%;
}

body {
    min-height:100vh;
    display:grid;
    place-items:center;
    padding:20px;
    background:
        linear-gradient(
            135deg,
            #f4f8f6,
            #e7f0eb
        );
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

.card {
    width:100%;
    max-width:430px;
    background:#fff;
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 20px 55px rgba(11,61,46,.12);
}

.top {
    height:7px;
    background:
        linear-gradient(
            90deg,
            var(--g),
            var(--gl),
            var(--gold)
        );
}

.content {
    padding:35px 30px 30px;
}

.brand {
    text-align:center;
}

.brand img {
    width:72px;
    height:72px;
    object-fit:contain;
}

h1 {
    margin:15px 0 0;
    color:var(--g);
    font-size:22px;
}

.subtitle {
    margin:8px auto 23px;
    max-width:330px;
    color:var(--muted);
    font-size:8px;
    line-height:1.7;
    text-align:center;
}

.error {
    display:none;
    margin-bottom:13px;
    padding:10px;
    border-radius:7px;
    background:var(--danger-bg);
    color:var(--danger);
    font-size:8px;
}

.error.show {
    display:block;
}

.form {
    display:grid;
    gap:13px;
}

.field {
    display:grid;
    gap:5px;
}

.field label {
    color:var(--text);
    font-size:7px;
    font-weight:800;
}

.field input {
    width:100%;
    min-height:42px;
    padding:0 11px;
    border:1px solid var(--border);
    border-radius:7px;
    outline:none;
    font-size:9px;
}

.field input:focus {
    border-color:var(--gl);
    box-shadow:0 0 0 3px rgba(23,107,72,.08);
}

button {
    min-height:43px;
    border:0;
    border-radius:7px;
    background:var(--g);
    color:#fff;
    font-size:8px;
    font-weight:800;
    cursor:pointer;
}

button:hover {
    background:var(--gd);
}

button:disabled {
    opacity:.6;
    cursor:not-allowed;
}

.note {
    margin-top:19px;
    padding-top:15px;
    border-top:1px solid var(--border);
    color:var(--muted);
    font-size:7px;
    line-height:1.6;
    text-align:center;
}

.footer {
    padding:14px;
    border-top:1px solid var(--border);
    background:#fafcfb;
    color:var(--muted);
    text-align:center;
    font-size:7px;
}

@media(max-width:500px) {
    .content {
        padding:28px 22px 24px;
    }
}
</style>

</head>

<body>

<main class="card">

<div class="top"></div>

<div class="content">

<div class="brand">

<img
    src="../assets/gtf-logo.svg"
    alt="Global TrustFund"
>

<h1>Cashier Sign In</h1>

<p class="subtitle">
    Secure access for authorized cashier personnel.
    All authenticated operational activity is logged.
</p>

</div>

<div id="error" class="error"></div>

<form id="loginForm" class="form">

<div class="field">

<label for="identifier">
    Staff ID or Email
</label>

<input
    id="identifier"
    name="identifier"
    type="text"
    autocomplete="username"
    required
>

</div>

<div class="field">

<label for="password">
    Password
</label>

<input
    id="password"
    name="password"
    type="password"
    autocomplete="current-password"
    required
>

</div>

<button id="submitButton" type="submit">
    Sign In
</button>

</form>

<div class="note">
    Cashier permissions are determined by the authenticated
    backend role. Do not share your staff credentials.
</div>

</div>

<footer class="footer">
    © 2026 Global TrustFund · Cashier Operations
</footer>

</main>

<script>
const API_BASE = "/api";

const form = document.getElementById("loginForm");
const errorBox = document.getElementById("error");
const submitButton = document.getElementById("submitButton");

form.addEventListener("submit", async event => {

    event.preventDefault();

    errorBox.classList.remove("show");

    submitButton.disabled = true;
    submitButton.textContent = "Signing in...";

    const identifier =
        document.getElementById("identifier")
            .value
            .trim();

    const password =
        document.getElementById("password")
            .value;

    try {

        const response = await fetch(
            API_BASE + "/auth/login",
            {
                method:"POST",
                credentials:"include",
                headers:{
                    "Accept":"application/json",
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    identifier,
                    email:identifier,
                    password,
                    role:"cashier"
                })
            }
        );

        const data =
            await response
                .json()
                .catch(() => ({}));

        if (!response.ok) {
            throw new Error(
                data.message ||
                data.error ||
                "Unable to sign in."
            );
        }

        if (data.user) {
            localStorage.setItem(
                "gtf_user",
                JSON.stringify(data.user)
            );
        }

        window.location.replace("./index.html");

    } catch (error) {

        errorBox.textContent =
            error.message;

        errorBox.classList.add("show");

        submitButton.disabled = false;
        submitButton.textContent = "Sign In";
    }
});
</script>

</body>
</html>
