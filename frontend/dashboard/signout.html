<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Sign out of Global TrustFund Banking."
    >

    <meta
        name="theme-color"
        content="#0b3d2e"
    >

    <title>
        Sign Out | Global TrustFund
    </title>

    <link
        rel="stylesheet"
        href="../css/styles.css"
    >

    <style>

        :root {
            --gtf-green: #0b3d2e;
            --gtf-dark: #092f24;
            --gtf-light: #176b48;
            --gtf-bg: #f4f8f6;
            --gtf-border: #dfe8e3;
            --gtf-text: #18372c;
            --gtf-muted: #7c8983;
            --gtf-danger: #8b4444;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            background: var(--gtf-bg);
            color: var(--gtf-text);
            font-family:
                Arial,
                Helvetica,
                sans-serif;
        }

        .signout-page {
            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }

        /* =====================================================
           HEADER
           ===================================================== */

        .signout-header {
            width: 100%;

            background: #ffffff;

            border-bottom:
                1px solid
                var(--gtf-border);
        }

        .signout-header-inner {
            width: 100%;
            max-width: 1180px;

            min-height: 74px;

            margin: 0 auto;
            padding: 12px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;

            color: var(--gtf-green);

            text-decoration: none;
        }

        .brand-logo {
            width: 45px;
            height: 45px;

            display: block;

            object-fit: contain;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
        }

        .brand-text strong {
            color: var(--gtf-green);

            font-size: 14px;
            line-height: 1.2;

            font-weight: 800;
        }

        .brand-text small {
            margin-top: 3px;

            color: var(--gtf-muted);

            font-size: 9px;
        }

        /* =====================================================
           MAIN
           ===================================================== */

        .signout-main {
            flex: 1;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        .signout-card {
            width: 100%;
            max-width: 460px;

            padding: 35px 30px;

            background: #ffffff;

            border:
                1px solid
                var(--gtf-border);

            border-radius: 16px;

            text-align: center;

            box-shadow:
                0 18px 45px
                rgba(11, 61, 46, .08);
        }

        /* =====================================================
           ICON
           ===================================================== */

        .signout-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eaf3ee;

            color: var(--gtf-green);

            font-size: 25px;
            font-weight: 800;
        }

        .signout-card h1 {
            margin: 0;

            color: var(--gtf-green);

            font-size: 25px;
            line-height: 1.2;
        }

        .signout-card p {
            margin: 12px auto 0;

            max-width: 340px;

            color: var(--gtf-muted);

            font-size: 9px;
            line-height: 1.7;
        }

        /* =====================================================
           STATUS
           ===================================================== */

        .status {
            display: none;

            margin-top: 20px;

            padding: 11px 12px;

            border-radius: 8px;

            font-size: 8px;
            line-height: 1.5;
        }

        .status.error {
            display: block;

            background: #f9eded;
            color: var(--gtf-danger);
        }

        /* =====================================================
           ACTIONS
           ===================================================== */

        .signout-actions {
            margin-top: 25px;

            display: grid;
            gap: 10px;
        }

        .button {
            width: 100%;

            min-height: 45px;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            border-radius: 7px;

            font-family: inherit;

            font-size: 9px;
            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            transition:
                background .2s ease,
                border-color .2s ease,
                transform .1s ease;
        }

        .button-primary {
            border:
                1px solid
                var(--gtf-green);

            background:
                var(--gtf-green);

            color: #ffffff;
        }

        .button-primary:hover {
            background:
                var(--gtf-dark);
        }

        .button-secondary {
            border:
                1px solid
                var(--gtf-border);

            background:
                #ffffff;

            color:
                var(--gtf-green);
        }

        .button-secondary:hover {
            background:
                #eaf3ee;
        }

        .button:active {
            transform:
                translateY(1px);
        }

        /* =====================================================
           SECURITY NOTE
           ===================================================== */

        .security-note {
            margin-top: 23px;
            padding-top: 17px;

            border-top:
                1px solid
                var(--gtf-border);

            color:
                var(--gtf-muted);

            font-size: 7px;
            line-height: 1.6;
        }

        /* =====================================================
           FOOTER
           ===================================================== */

        .signout-footer {
            padding: 18px 20px;

            background:
                #ffffff;

            border-top:
                1px solid
                var(--gtf-border);
        }

        .signout-footer-inner {
            width: 100%;
            max-width: 1180px;

            margin: 0 auto;

            display: flex;
            align-items: center;
            justify-content: space-between;

            color:
                var(--gtf-muted);

            font-size: 7px;
        }

        /* =====================================================
           MOBILE
           ===================================================== */

        @media (max-width: 600px) {

            .signout-header-inner {
                padding:
                    12px 14px;
            }

            .signout-main {
                padding:
                    25px 14px;
            }

            .signout-card {
                padding:
                    28px 20px;
            }

            .signout-card h1 {
                font-size: 22px;
            }

            .signout-footer-inner {
                flex-direction: column;

                gap: 8px;

                text-align: center;
            }

        }

    </style>

</head>


<body>

<div class="signout-page">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header class="signout-header">

        <div class="signout-header-inner">


            <a
                href="../index.html"
                class="brand"
                aria-label="Global TrustFund home"
            >

                <img
                    src="../assets/gtf-logo.svg"
                    alt="Global TrustFund logo"
                    class="brand-logo"
                >


                <span class="brand-text">

                    <strong>
                        Global TrustFund
                    </strong>

                    <small>
                        Banking
                    </small>

                </span>

            </a>


        </div>

    </header>


    <!-- =====================================================
         MAIN
         ===================================================== -->

    <main class="signout-main">


        <section
            class="signout-card"
            aria-labelledby="signoutTitle"
        >


            <div
                class="signout-icon"
                aria-hidden="true"
            >
                ✓
            </div>


            <h1 id="signoutTitle">
                Sign out of your account?
            </h1>


            <p>
                You can safely end your current
                Global TrustFund banking session.
            </p>


            <div
                id="statusMessage"
                class="status"
                role="alert"
                aria-live="polite"
            ></div>


            <div class="signout-actions">


                <button
                    id="signoutButton"
                    type="button"
                    class="button button-primary"
                >
                    Sign Out
                </button>


                <a
                    href="./index.html"
                    class="button button-secondary"
                >
                    Return to Dashboard
                </a>


            </div>


            <div class="security-note">

                For your security, always sign out when
                using a shared or public device.

            </div>


        </section>

    </main>


    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer class="signout-footer">

        <div class="signout-footer-inner">

            <span>
                ©
                <span id="currentYear"></span>
                Global TrustFund.
                All rights reserved.
            </span>

            <span>
                Secure digital banking platform
            </span>

        </div>

    </footer>


</div>


<!-- =========================================================
     EXISTING JAVASCRIPT
     ========================================================= -->

<script src="../js/app.js"></script>
<script src="../js/supabase.js"></script>
<script src="../js/auth.js"></script>


<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {

            document.getElementById(
                "currentYear"
            ).textContent =
                new Date().getFullYear();


            const signoutButton =
                document.getElementById(
                    "signoutButton"
                );


            signoutButton.addEventListener(
                "click",
                handleSignOut
            );

        }
    );


    /* =====================================================
       SIGN OUT
       ===================================================== */

    async function handleSignOut() {

        const button =
            document.getElementById(
                "signoutButton"
            );


        const originalText =
            button.textContent;


        button.disabled = true;

        button.textContent =
            "Signing Out...";


        clearStatus();


        try {

            /*
             * Prefer the existing auth.js
             * sign-out function when available.
             */

            if (
                typeof window.signOutUser ===
                "function"
            ) {

                await window.signOutUser();


                redirectToLogin();

                return;

            }


            if (
                typeof window.logoutUser ===
                "function"
            ) {

                await window.logoutUser();


                redirectToLogin();

                return;

            }


            /*
             * Direct Supabase fallback.
             */

            if (
                window.supabaseClient &&
                typeof window.supabaseClient.auth?.signOut ===
                "function"
            ) {

                const {
                    error
                } =
                    await window.supabaseClient
                        .auth
                        .signOut();


                if (error) {
                    throw error;
                }


                redirectToLogin();

                return;

            }


            /*
             * Support alternative variable names
             * if the existing supabase.js uses them.
             */

            if (
                window.supabase &&
                typeof window.supabase.auth?.signOut ===
                "function"
            ) {

                const {
                    error
                } =
                    await window.supabase
                        .auth
                        .signOut();


                if (error) {
                    throw error;
                }


                redirectToLogin();

                return;

            }


            /*
             * Backend session fallback.
             */

            const response =
                await fetch(
                    "../api/auth/logout",
                    {
                        method: "POST",

                        credentials: "include",

                        headers: {
                            "Accept":
                                "application/json"
                        }
                    }
                );


            /*
             * A 404 means the backend route
             * does not exist yet.
             */

            if (
                response.status === 404
            ) {

                throw new Error(
                    "No supported sign-out method was found."
                );

            }


            if (!response.ok) {

                let result = null;


                try {

                    result =
                        await response.json();

                } catch (_) {}


                throw new Error(
                    result?.error ||
                    result?.message ||
                    "Unable to sign out."
                );

            }


            redirectToLogin();


        } catch (error) {

            console.error(
                "Sign-out error:",
                error
            );


            showStatus(
                error?.message ||
                "We could not complete sign out. Please try again."
            );


            button.disabled = false;

            button.textContent =
                originalText;

        }

    }


    /* =====================================================
       REDIRECT
       ===================================================== */

    function redirectToLogin() {

        /*
         * Replace the current page so the user
         * cannot simply use the browser Back button
         * to return to this sign-out screen.
         */

        window.location.replace(
            "../login.html"
        );

    }


    /* =====================================================
       STATUS
       ===================================================== */

    function showStatus(
        message
    ) {

        const status =
            document.getElementById(
                "statusMessage"
            );


        status.className =
            "status error";


        status.textContent =
            message;

    }


    function clearStatus() {

        const status =
            document.getElementById(
                "statusMessage"
            );


        status.className =
            "status";


        status.textContent =
            "";

    }

</script>


</body>

</html>
