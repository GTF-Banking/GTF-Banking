<!-- =========================================================
     FILE: frontend/login.html
     GLOBAL TRUSTFUND — SIGN IN
     ========================================================= -->
<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Sign In — Global TrustFund</title>

  <meta
    name="description"
    content="Sign in to your Global TrustFund digital banking account."
  >

  <meta
    name="theme-color"
    content="#063c2c"
  >

  <link
    rel="icon"
    href="/assets/gtf-logo.svg"
    type="image/svg+xml"
  >

  <link
    rel="stylesheet"
    href="/css/styles.css"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

</head>


<body>

  <main class="auth-page">

    <section
      class="auth-card"
      aria-labelledby="login-title"
    >

      <!-- LOGO -->

      <div class="auth-logo">

        <a
          href="/index.html"
          class="logo-link"
          style="
            justify-content:center;
            color:var(--deep);
          "
        >

          <span class="logo-mark">
            GTF
          </span>

          <span>
            Global TrustFund
          </span>

        </a>

      </div>


      <!-- TITLE -->

      <h1
        id="login-title"
        class="auth-title"
      >
        Welcome Back
      </h1>


      <p class="auth-subtitle">
        Sign in to access your digital banking dashboard.
      </p>


      <!-- ALERT -->

      <div
        id="alert-box"
        aria-live="polite"
      ></div>


      <!-- LOGIN FORM -->

      <form
        id="login-form"
        novalidate
      >

        <div class="form-group">

          <label
            class="form-label"
            for="email"
          >
            Email address
          </label>

          <input
            class="form-control"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <div class="form-group">

          <div
            style="
              display:flex;
              align-items:center;
              justify-content:space-between;
              gap:10px;
            "
          >

            <label
              class="form-label"
              for="password"
            >
              Password
            </label>

            <a
              href="/forgot-password.html"
              style="font-size:.78rem;"
            >
              Forgot password?
            </a>

          </div>


          <input
            class="form-control"
            type="password"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >

        </div>


        <div class="form-group">

          <label class="form-check">

            <input
              type="checkbox"
              id="remember"
              name="remember"
            >

            <span>
              Remember this device
            </span>

          </label>

        </div>


        <button
          type="submit"
          class="btn btn-primary btn-block btn-lg"
          id="login-btn"
        >
          Sign In
        </button>

      </form>


      <!-- REGISTER -->

      <p class="auth-footer">

        Don't have an account?

        <a href="/signup.html">
          Create Account
        </a>

      </p>


      <!-- BACK -->

      <div
        style="
          text-align:center;
          margin-top:16px;
        "
      >

        <a
          href="/index.html"
          style="font-size:.84rem;"
        >
          ← Back to Global TrustFund
        </a>

      </div>

    </section>

  </main>


  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>


  <script>

    const form =
      document.getElementById("login-form");

    const email =
      document.getElementById("email");

    const password =
      document.getElementById("password");

    const button =
      document.getElementById("login-btn");

    const alertBox =
      document.getElementById("alert-box");


    function showLoginAlert(
      type,
      message
    ) {

      if (
        window.GTF_APP &&
        typeof GTF_APP.showAlert === "function"
      ) {

        GTF_APP.showAlert(
          alertBox,
          type,
          message
        );

        return;
      }


      alertBox.innerHTML =
        '<div class="alert alert-' +
        type +
        '">' +
        message +
        "</div>";
    }


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        alertBox.innerHTML = "";


        const emailValue =
          email.value.trim();

        const passwordValue =
          password.value;


        if (!emailValue) {

          showLoginAlert(
            "danger",
            "Please enter your email address."
          );

          email.focus();

          return;
        }


        if (!email.validity.valid) {

          showLoginAlert(
            "danger",
            "Please enter a valid email address."
          );

          email.focus();

          return;
        }


        if (!passwordValue) {

          showLoginAlert(
            "danger",
            "Please enter your password."
          );

          password.focus();

          return;
        }


        button.disabled = true;

        button.textContent =
          "Signing in...";


        try {

          if (
            !window.GTF_AUTH ||
            typeof GTF_AUTH.login !== "function"
          ) {

            throw new Error(
              "Authentication service is not available."
            );
          }


          const response =
            await GTF_AUTH.login(
              emailValue,
              passwordValue
            );


          /*
           * Save remember preference.
           */
          if (
            document.getElementById("remember").checked
          ) {

            localStorage.setItem(
              "gtf_remember_device",
              "true"
            );

          } else {

            localStorage.removeItem(
              "gtf_remember_device"
            );
          }


          showLoginAlert(
            "success",
            "Sign in successful. Redirecting..."
          );


          const redirect =
            sessionStorage.getItem(
              "gtf_redirect_after_login"
            );


          sessionStorage.removeItem(
            "gtf_redirect_after_login"
          );


          setTimeout(
            function () {

              window.location.href =
                redirect ||
                "/dashboard/index.html";

            },
            700
          );


        } catch (error) {

          console.error(
            "Login error:",
            error
          );


          showLoginAlert(
            "danger",
            error.message ||
            "Unable to sign in. Please check your credentials and try again."
          );


          button.disabled = false;

          button.textContent =
            "Sign In";
        }

      }
    );

  </script>

</body>
</html>
