<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Global TrustFund</title>
  <meta name="description" content="Sign in to your Global TrustFund digital banking simulation account.">
  <link rel="icon" href="assets/gtf-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="index.html" class="logo-link" style="justify-content:center;color:var(--deep);">
          <span class="logo-mark">GTF</span>
          <span>Global TrustFund</span>
        </a>
      </div>
      <h1 class="auth-title">Sign In</h1>
      <p class="auth-subtitle">Access your secure banking dashboard</p>
      <div id="alert-box"></div>
      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Sign In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="signup.html">Create Account</a></p>
      <p class="auth-footer" style="margin-top:0.5rem;"><a href="index.html">← Back to home</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const box = document.getElementById('alert-box');
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      box.innerHTML = '';
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      try {
        await GTF_AUTH.login(email, password);
        const params = new URLSearchParams(window.location.search);
        const next = params.get('next') || '/dashboard/index.html';
        window.location.href = next;
      } catch (err) {
        GTF_APP.showAlert(box, 'danger', err.message || 'Invalid email or password.');
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
