<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manager Sign In | Global TrustFund</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--gt-soft-white);">
  <div class="card" style="width:100%;max-width:400px;">
    <div data-brand="full" style="margin-bottom:1.5rem;"></div>
    <h1 style="font-size:1.35rem;margin-bottom:0.35rem;">Manager Sign In</h1>
    <p class="text-muted text-sm" style="margin-bottom:1.5rem;">Supervisory access only.</p>
    <form id="form">
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-input" type="email" id="email" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-input" type="password" id="password" required />
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>
    <p class="text-muted text-sm" style="margin-top:1rem;text-align:center;"><a href="/">← Public site</a></p>
  </div>
  <script src="/js/logo-loader.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/speed-insights.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const data = await GTF.auth.login({ email: email.value.trim(), password: password.value });
        if (!['manager','admin','super_admin'].includes(data.user?.role)) {
          GTF.auth.clearSession();
          GTF.toast('No manager access for this account.', 'error');
          return;
        }
        location.href = '/manager/';
      } catch (err) {
        GTF.toast(err.message || 'Sign in failed', 'error');
      }
    });
  </script>
</body>
</html>
