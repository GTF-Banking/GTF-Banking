<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="gtf-logo-title gtf-logo-description"
>
  <title id="gtf-logo-title">GTF Banking</title>
  <desc id="gtf-logo-description">
    Global TrustFund Banking shield logo with GTF initials.
  </desc>

  <defs>
    <linearGradient
      id="gtfShieldGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#0B2A4A"/>
      <stop offset="100%" stop-color="#145DA0"/>
    </linearGradient>

    <linearGradient
      id="gtfGoldGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#F6D365"/>
      <stop offset="100%" stop-color="#C9962B"/>
    </linearGradient>
  </defs>

  <!-- Outer banking shield -->
  <path
    d="
      M256 24
      L452 91
      V232
      C452 350 378 437 256 490
      C134 437 60 350 60 232
      V91
      Z
    "
    fill="url(#gtfShieldGradient)"
  />

  <!-- Gold shield border -->
  <path
    d="
      M256 45
      L429 104
      V230
      C429 335 365 412 256 464
      C147 412 83 335 83 230
      V104
      Z
    "
    fill="none"
    stroke="url(#gtfGoldGradient)"
    stroke-width="10"
    stroke-linejoin="round"
  />

  <!-- Inner trust emblem -->
  <path
    d="
      M256 105
      L367 143
      V224
      C367 297 325 351 256 386
      C187 351 145 297 145 224
      V143
      Z
    "
    fill="none"
    stroke="#FFFFFF"
    stroke-width="6"
    opacity="0.9"
  />

  <!-- G -->
  <path
    d="
      M221 175
      C210 162 195 155 179 155
      C146 155 124 180 124 216
      C124 252 147 277 179 277
      C198 277 216 270 229 257
      V222
      H177
      V244
      H205
      C198 252 190 256 180 256
      C161 256 149 240 149 216
      C149 192 161 176 180 176
      C194 176 205 182 212 191
      Z
    "
    fill="#FFFFFF"
  />

  <!-- T -->
  <path
    d="
      M220 155
      H322
      V179
      H286
      V277
      H256
      V179
      H220
      Z
    "
    fill="#FFFFFF"
  />

  <!-- F -->
  <path
    d="
      M315 155
      H390
      V179
      H345
      V205
      H382
      V228
      H345
      V277
      H315
      Z
    "
    fill="#FFFFFF"
  />

  <!-- Gold divider -->
  <path
    d="M155 318 H357"
    fill="none"
    stroke="url(#gtfGoldGradient)"
    stroke-width="9"
    stroke-linecap="round"
  />

  <!-- Trust mark -->
  <circle
    cx="256"
    cy="351"
    r="10"
    fill="url(#gtfGoldGradient)"
  />

</svg>