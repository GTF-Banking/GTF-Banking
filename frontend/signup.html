<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — Global TrustFund</title>
  <meta name="description" content="Register for a Global TrustFund digital banking simulation account.">
  <link rel="icon" href="assets/gtf-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card wide">
      <div class="auth-logo">
        <a href="index.html" class="logo-link" style="justify-content:center;color:var(--deep);">
          <span class="logo-mark">GTF</span>
          <span>Global TrustFund</span>
        </a>
      </div>
      <h1 class="auth-title">Create Account</h1>
      <p class="auth-subtitle">Join the Global TrustFund simulation platform</p>
      <div id="alert-box"></div>
      <form id="signup-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first_name">First name</label>
            <input class="form-control" type="text" id="first_name" name="first_name" required autocomplete="given-name">
          </div>
          <div class="form-group">
            <label class="form-label" for="last_name">Last name</label>
            <input class="form-control" type="text" id="last_name" name="last_name" required autocomplete="family-name">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="phone">Phone</label>
          <input class="form-control" type="tel" id="phone" name="phone" required autocomplete="tel" placeholder="+1 555 000 0000">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="account_type">Account type</label>
            <select class="form-control" id="account_type" name="account_type" required>
              <option value="">Select...</option>
              <option value="personal">Personal</option>
              <option value="business">Business</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="country">Country</label>
            <select class="form-control" id="country" name="country" required>
              <option value="">Select...</option>
              <option value="US">United States</option>
              <option value="GB">United Kingdom</option>
              <option value="CA">Canada</option>
              <option value="NG">Nigeria</option>
              <option value="GH">Ghana</option>
              <option value="KE">Kenya</option>
              <option value="ZA">South Africa</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input class="form-control" type="password" id="password" name="password" required autocomplete="new-password" minlength="8">
          <div class="password-strength"><div class="password-strength-bar" id="strength-bar"></div></div>
          <p class="form-hint">Min 8 characters, uppercase, lowercase, number, and special character.</p>
        </div>
        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm password</label>
          <input class="form-control" type="password" id="confirm_password" name="confirm_password" required autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="terms" name="terms" required>
            <span>I agree to the <a href="terms.html" target="_blank">Terms of Service</a> and <a href="privacy.html" target="_blank">Privacy Policy</a>. I understand this is a simulation platform.</span>
          </label>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Create Account</button>
      </form>
      <p class="auth-footer">Already have an account? <a href="login.html">Sign In</a></p>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
    const pw = document.getElementById('password');
    const bar = document.getElementById('strength-bar');
    const colors = ['#B33A3A', '#B8860B', '#B8860B', '#1B7A4E', '#1B7A4E'];
    pw.addEventListener('input', () => {
      const s = GTF_APP.passwordStrength(pw.value);
      bar.style.width = (s * 20) + '%';
      bar.style.background = colors[Math.max(0, s - 1)] || '#DCE5E0';
    });

    document.getElementById('signup-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const box = document.getElementById('alert-box');
      const btn = document.getElementById('submit-btn');
      box.innerHTML = '';

      const first_name = document.getElementById('first_name').value.trim();
      const last_name = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const account_type = document.getElementById('account_type').value;
      const country = document.getElementById('country').value;
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm_password').value;
      const terms = document.getElementById('terms').checked;

      if (!terms) {
        GTF_APP.showAlert(box, 'danger', 'Please accept the Terms and Privacy Policy.');
        return;
      }
      if (password !== confirm) {
        GTF_APP.showAlert(box, 'danger', 'Passwords do not match.');
        return;
      }
      if (!GTF_APP.validatePassword(password)) {
        GTF_APP.showAlert(box, 'danger', 'Password must be at least 8 characters and include uppercase, lowercase, number, and special character.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';
      try {
        const data = await GTF_AUTH.signup({
          first_name, last_name, email, phone, account_type, country, password
        });
        if (
          data.requires_confirmation ||
          data.email_confirmation_required ||
          (data.message && data.message.toLowerCase().includes('confirm'))
        ) {
          GTF_APP.showAlert(
            box,
            'success',
            'Account created successfully. Please check your email and confirm your email address before signing in.'
          );
          document.getElementById('signup-form').reset();
          bar.style.width = '0';
        } else {
          GTF_APP.showAlert(box, 'success', 'Account created. Redirecting to sign in...');
          setTimeout(() => {
            window.location.href = '/login.html';
          }, 1500);
        }
      } catch (err) {
        GTF_APP.showAlert(box, 'danger', err.message || 'Registration failed. Please try again.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
