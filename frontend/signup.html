<!-- =========================================================

     ========================================================= -->

<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account — Global TrustFund</title>

  <meta
    name="description"
    content="Create a Global TrustFund digital banking account."
  >

  <meta
    name="theme-color"
    content="#063c2c"
  >

  <link
    rel="icon"
    href="/assets/gtf-logo.svg"
    type="image/svg+xml"
  >

  <link
    rel="stylesheet"
    href="/css/styles.css"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

</head>


<body>

  <main class="auth-page">

    <section class="auth-card wide">

      <!-- LOGO -->

      <div class="auth-logo">

        <a
          href="/index.html"
          class="logo-link"
          style="
            justify-content:center;
            color:var(--deep);
          "
        >

          <span class="logo-mark">
            GTF
          </span>

          <span>
            Global TrustFund
          </span>

        </a>

      </div>


      <h1 class="auth-title">
        Create Account
      </h1>


      <p class="auth-subtitle">
        Get started with your Global TrustFund digital banking account.
      </p>


      <div
        id="alert-box"
        aria-live="polite"
      ></div>


      <form
        id="signup-form"
        novalidate
      >

        <!-- NAME -->

        <div class="form-row">

          <div class="form-group">

            <label
              class="form-label"
              for="first_name"
            >
              First name
            </label>

            <input
              class="form-control"
              type="text"
              id="first_name"
              name="first_name"
              autocomplete="given-name"
              required
            >

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="last_name"
            >
              Last name
            </label>

            <input
              class="form-control"
              type="text"
              id="last_name"
              name="last_name"
              autocomplete="family-name"
              required
            >

          </div>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

          <label
            class="form-label"
            for="email"
          >
            Email address
          </label>

          <input
            class="form-control"
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            autocomplete="email"
            required
          >

        </div>


        <!-- PHONE -->

        <div class="form-group">

          <label
            class="form-label"
            for="phone"
          >
            Phone number
          </label>

          <input
            class="form-control"
            type="tel"
            id="phone"
            name="phone"
            placeholder="+234 800 000 0000"
            autocomplete="tel"
            required
          >

        </div>


        <!-- ACCOUNT TYPE / COUNTRY -->

        <div class="form-row">

          <div class="form-group">

            <label
              class="form-label"
              for="account_type"
            >
              Account type
            </label>

            <select
              class="form-control"
              id="account_type"
              name="account_type"
              required
            >

              <option value="">
                Select account type
              </option>

              <option value="personal">
                Personal
              </option>

              <option value="business">
                Business
              </option>

            </select>

          </div>


          <div class="form-group">

            <label
              class="form-label"
              for="country"
            >
              Country
            </label>

            <select
              class="form-control"
              id="country"
              name="country"
              required
            >

              <option value="">
                Select country
              </option>

              <option value="NG">
                Nigeria
              </option>

              <option value="US">
                United States
              </option>

              <option value="GB">
                United Kingdom
              </option>

              <option value="CA">
                Canada
              </option>

              <option value="GH">
                Ghana
              </option>

              <option value="KE">
                Kenya
              </option>

              <option value="ZA">
                South Africa
              </option>

              <option value="OTHER">
                Other
              </option>

            </select>

          </div>

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

          <label
            class="form-label"
            for="password"
          >
            Password
          </label>

          <input
            class="form-control"
            type="password"
            id="password"
            name="password"
            autocomplete="new-password"
            minlength="8"
            required
          >


          <div class="password-strength">

            <div
              class="password-strength-bar"
              id="strength-bar"
            ></div>

          </div>


          <p class="form-hint">
            Use at least 8 characters with uppercase,
            lowercase, a number and a special character.
          </p>

        </div>


        <!-- CONFIRM -->

        <div class="form-group">

          <label
            class="form-label"
            for="confirm_password"
          >
            Confirm password
          </label>

          <input
            class="form-control"
            type="password"
            id="confirm_password"
            name="confirm_password"
            autocomplete="new-password"
            required
          >

        </div>


        <!-- TERMS -->

        <div class="form-group">

          <label class="form-check">

            <input
              type="checkbox"
              id="terms"
              name="terms"
              required
            >

            <span>

              I agree to the
              <a
                href="/terms.html"
                target="_blank"
                rel="noopener"
              >
                Terms of Service
              </a>

              and

              <a
                href="/privacy.html"
                target="_blank"
                rel="noopener"
              >
                Privacy Policy
              </a>.

            </span>

          </label>

        </div>


        <!-- SUBMIT -->

        <button
          type="submit"
          class="btn btn-primary btn-block btn-lg"
          id="submit-btn"
        >
          Create Account
        </button>

      </form>


      <p class="auth-footer">

        Already have an account?

        <a href="/login.html">
          Sign In
        </a>

      </p>


      <div
        style="
          text-align:center;
          margin-top:15px;
        "
      >

        <a
          href="/index.html"
          style="font-size:.84rem;"
        >
          ← Back to Home
        </a>

      </div>

    </section>

  </main>


  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/app.js"></script>


  <script>

    const form =
      document.getElementById("signup-form");

    const password =
      document.getElementById("password");

    const confirmPassword =
      document.getElementById("confirm_password");

    const strengthBar =
      document.getElementById("strength-bar");

    const submitButton =
      document.getElementById("submit-btn");

    const alertBox =
      document.getElementById("alert-box");


    const strengthColors = [
      "#B33A3A",
      "#B8860B",
      "#B8860B",
      "#1B7A4E",
      "#1B7A4E"
    ];


    function showSignupAlert(
      type,
      message
    ) {

      if (
        window.GTF_APP &&
        typeof GTF_APP.showAlert === "function"
      ) {

        GTF_APP.showAlert(
          alertBox,
          type,
          message
        );

        return;
      }


      alertBox.innerHTML =
        '<div class="alert alert-' +
        type +
        '">' +
        message +
        "</div>";
    }


    function passwordStrength(value) {

      let score = 0;

      if (value.length >= 8) {
        score++;
      }

      if (/[A-Z]/.test(value)) {
        score++;
      }

      if (/[a-z]/.test(value)) {
        score++;
      }

      if (/[0-9]/.test(value)) {
        score++;
      }

      if (/[^A-Za-z0-9]/.test(value)) {
        score++;
      }

      return score;
    }


    password.addEventListener(
      "input",
      function () {

        const score =
          passwordStrength(
            password.value
          );


        strengthBar.style.width =
          (score * 20) + "%";


        strengthBar.style.background =
          strengthColors[
            Math.max(0, score - 1)
          ] ||
          "#DCE5E0";
      }
    );


    form.addEventListener(
      "submit",
      async function (event) {

        event.preventDefault();

        alertBox.innerHTML = "";


        const first_name =
          document
            .getElementById("first_name")
            .value
            .trim();


        const last_name =
          document
            .getElementById("last_name")
            .value
            .trim();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const phone =
          document
            .getElementById("phone")
            .value
            .trim();


        const account_type =
          document
            .getElementById("account_type")
            .value;


        const country =
          document
            .getElementById("country")
            .value;


        const passwordValue =
          password.value;


        const confirmValue =
          confirmPassword.value;


        const terms =
          document
            .getElementById("terms")
            .checked;


        if (
          !first_name ||
          !last_name ||
          !email ||
          !phone ||
          !account_type ||
          !country
        ) {

          showSignupAlert(
            "danger",
            "Please complete all required fields."
          );

          return;
        }


        if (
          !document
            .getElementById("email")
            .validity.valid
        ) {

          showSignupAlert(
            "danger",
            "Please enter a valid email address."
          );

          return;
        }


        if (!terms) {

          showSignupAlert(
            "danger",
            "Please accept the Terms of Service and Privacy Policy."
          );

          return;
        }


        if (
          passwordValue !==
          confirmValue
        ) {

          showSignupAlert(
            "danger",
            "Passwords do not match."
          );

          return;
        }


        if (
          passwordStrength(
            passwordValue
          ) < 5
        ) {

          showSignupAlert(
            "danger",
            "Password must contain at least 8 characters, uppercase, lowercase, number and special character."
          );

          return;
        }


        submitButton.disabled =
          true;

        submitButton.textContent =
          "Creating account...";


        try {

          if (
            !window.GTF_AUTH ||
            typeof GTF_AUTH.signup !== "function"
          ) {

            throw new Error(
              "Registration service is not available."
            );
          }


          const response =
            await GTF_AUTH.signup({

              first_name,
              last_name,
              email,
              phone,
              account_type,
              country,
              password:
                passwordValue

            });


          const requiresConfirmation =
            response &&
            (
              response.requires_confirmation ||
              response.email_confirmation_required ||
              (
                response.message &&
                response.message
                  .toLowerCase()
                  .includes("confirm")
              )
            );


          if (
            requiresConfirmation
          ) {

            showSignupAlert(
              "success",
              "Account created successfully. Please check your email and confirm your email address before signing in."
            );


            form.reset();

            strengthBar.style.width =
              "0";


            submitButton.disabled =
              false;

            submitButton.textContent =
              "Create Account";


            return;
          }


          showSignupAlert(
            "success",
            "Account created successfully. Redirecting to sign in..."
          );


          setTimeout(
            function () {

              window.location.href =
                "/login.html";

            },
            1200
          );


        } catch (error) {

          console.error(
            "Registration error:",
            error
          );


          showSignupAlert(
            "danger",
            error.message ||
            "Registration failed. Please try again."
          );


          submitButton.disabled =
            false;

          submitButton.textContent =
            "Create Account";
        }

      }
    );

  </script>

</body>
</html>
