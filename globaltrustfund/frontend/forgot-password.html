<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Global TrustFund</title>
  <meta name="description" content="Reset your Global TrustFund account password." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <style>
    .auth-page { min-height: 100vh; display: flex; flex-direction: column; background: var(--gt-soft-white); }
    .auth-main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2.5rem 1.25rem; }
    .auth-card {
      width: 100%; max-width: 420px;
      background: var(--gt-white); border: 1px solid var(--gt-border);
      border-radius: var(--radius-xl); box-shadow: var(--gt-shadow-md);
      padding: 2.25rem 2rem;
    }
    .auth-card h1 { font-size: 1.45rem; margin-bottom: 0.35rem; }
    .auth-card .subtitle { color: var(--gt-muted-text); font-size: 0.925rem; margin-bottom: 1.75rem; }
    .form-error-banner {
      display: none; background: rgba(179,58,58,0.08); border: 1px solid rgba(179,58,58,0.25);
      color: var(--gt-danger); padding: 0.75rem 1rem; border-radius: var(--radius-md);
      font-size: 0.875rem; margin-bottom: 1.25rem;
    }
    .form-error-banner.visible { display: block; }
    .success-state {
      display: none; text-align: center; padding: 0.5rem 0;
    }
    .success-state.visible { display: block; }
    .success-state .icon {
      width: 56px; height: 56px; margin: 0 auto 1rem;
      background: rgba(27,122,78,0.12); border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; color: var(--gt-success);
    }
  </style>
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="header-inner">
      <div data-brand="full"></div>
      <div class="header-actions">
        <a href="/login.html" class="btn btn-ghost btn-sm">Sign In</a>
      </div>
    </div>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <div data-brand="full" style="margin-bottom:1.75rem;"></div>

      <div id="formState">
        <h1>Reset password</h1>
        <p class="subtitle">Enter the email associated with your account. We’ll send reset instructions if an account exists.</p>

        <div class="form-error-banner" id="errorBanner" role="alert"></div>

        <form id="forgotForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email address</label>
            <input class="form-input" type="email" id="email" name="email" required autocomplete="email" placeholder="you@example.com" />
            <span class="form-error" id="emailError" hidden></span>
          </div>
          <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;">Send reset link</button>
        </form>

        <p style="margin-top:1.5rem;text-align:center;font-size:0.9rem;">
          <a href="/login.html">← Back to sign in</a>
        </p>
      </div>

      <div class="success-state" id="successState">
        <div class="icon" aria-hidden="true">✓</div>
        <h1 style="font-size:1.25rem;">Check your email</h1>
        <p class="text-muted" style="margin:0.75rem 0 1.5rem;font-size:0.95rem;line-height:1.55;">
          If an account exists for that email, you will receive password reset instructions shortly.
        </p>
        <a href="/login.html" class="btn btn-primary" style="width:100%;">Return to sign in</a>
      </div>
    </div>
  </main>

  <footer class="site-footer" style="padding:1.5rem 0;">
    <div class="container">
      <div class="footer-bottom" style="border:none;padding:0;justify-content:center;">
        <span>© 2026 Global TrustFund</span>
      </div>
    </div>
  </footer>

  <script src="/js/logo-loader.js"></script>
  <script src="/js/env-bootstrap.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    (function () {
      const form = document.getElementById('forgotForm');
      const errorBanner = document.getElementById('errorBanner');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBanner.classList.remove('visible');
        const email = form.email.value.trim();

        if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
          document.getElementById('emailError').textContent = 'Enter a valid email address.';
          document.getElementById('emailError').hidden = false;
          return;
        }
        document.getElementById('emailError').hidden = true;
        submitBtn.disabled = true;
        submitBtn.textContent = 'Sending…';

        try {
          await GTF.api('/auth/forgot-password', {
            method: 'POST',
            body: { email }
          });
        } catch (err) {
          // Always show success to avoid email enumeration
        }

        document.getElementById('formState').style.display = 'none';
        document.getElementById('successState').classList.add('visible');
      });
    })();
  </script>
</body>
</html>
